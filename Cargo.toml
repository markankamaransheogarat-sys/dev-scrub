[package]
name = "dev-scrub"
version = "0.1.0"
edition = "2021"
authors = ["markankamaransheogarat-sys <markankamaransheogarat@users.noreply.github.com>"]
description = "Surgical Developer Disk Hygiene, Artifact Cleaner & Git-Aware Cache Vacuum in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/markankamaransheogarat-sys/dev-scrub"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"
